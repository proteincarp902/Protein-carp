<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protein & Carb Operations</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --green:#4e8f2f;
  --green-dark:#2f5f1f;
  --yellow:#f4c542;
  --cream:#f7f8ef;
  --card:#ffffff;
  --text:#263322;
  --muted:#7b8674;
  --border:#e5eadb;
  --shadow:0 18px 35px rgba(76,101,55,.13);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    linear-gradient(rgba(247,248,239,.88),rgba(247,248,239,.88)),
    url("background.jpg");
  background-size:420px;
}
.app{
  width:min(1100px,100%);
  margin:auto;
  padding:18px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}
.btn{
  border:0;
  background:var(--green);
  color:#fff;
  font-family:'Cairo';
  font-weight:800;
  border-radius:18px;
  padding:11px 18px;
  cursor:pointer;
  box-shadow:var(--shadow);
}
.btn.secondary{
  background:#fff;
  color:var(--green-dark);
  border:1px solid var(--border);
}
.hero{
  background:rgba(255,255,255,.82);
  border:1px solid var(--border);
  border-radius:34px;
  padding:26px 20px;
  text-align:center;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}
.logo{
  width:120px;
  height:120px;
  object-fit:contain;
  margin:auto;
  display:block;
}
.hero h1{
  margin:8px 0 0;
  font-size:28px;
  font-weight:900;
  color:var(--green-dark);
}
.date{
  color:var(--muted);
  font-weight:700;
  margin-top:5px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.tile{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:32px;
  min-height:165px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  cursor:pointer;
  transition:.18s;
}
.tile:hover{transform:translateY(-4px)}
.icon{
  width:74px;
  height:74px;
  border-radius:24px;
  display:grid;
  place-items:center;
  font-size:38px;
  background:#f3f8e9;
  border:1px solid #e2ebd5;
}
.tile:nth-child(1) .icon{background:#fff8d9}
.tile:nth-child(2) .icon{background:#eef9e8}
.tile:nth-child(3) .icon{background:#fff2df}
.tile:nth-child(4) .icon{background:#eaf2ff}
.tile h2{
  margin:0;
  font-size:20px;
  font-weight:900;
}
.page{display:none}
.page.active{display:block}
.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
}
input{
  width:100%;
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  font-family:'Cairo';
  font-size:16px;
  margin-bottom:12px;
}
.placeholder{
  text-align:center;
  color:var(--muted);
  font-weight:700;
  padding:35px 10px;
}
@media(max-width:700px){
  .grid{gap:12px}
  .tile{min-height:145px;border-radius:26px}
  .icon{width:64px;height:64px;font-size:32px}
  .tile h2{font-size:17px}
  .hero h1{font-size:22px}
  .logo{width:100px;height:100px}
}
</style>
</head>

<body>

<div class="app">

  <div id="home">
    <div class="topbar">
      <button class="btn secondary" onclick="openPage('settings')">الإعدادات</button>
      <button class="btn" onclick="openPage('admin')">الإدارة</button>
    </div>

    <section class="hero">
      <img src="logo.png" class="logo" alt="Protein & Carb">
      <h1>Protein & Carb Operations</h1>
      <div class="date" id="dateNow"></div>
    </section>

    <section class="grid">
      <div class="tile" onclick="openPage('operations')">
        <div class="icon">🏭</div>
        <h2>متابعة التشغيل</h2>
      </div>

      <div class="tile" onclick="openPage('cleaning')">
        <div class="icon">🧹</div>
        <h2>النظافة</h2>
      </div>

      <div class="tile" onclick="openPage('chefs')">
        <div class="icon">👨‍🍳</div>
        <h2>الشيفات</h2>
      </div>

      <div class="tile" onclick="openPage('warehouse')">
        <div class="icon">📦</div>
        <h2>المستودع</h2>
      </div>
    </section>
  </div>

  <section id="operations" class="page">
    <div class="page-head">
      <h2>متابعة التشغيل</h2>
      <button class="btn secondary" onclick="goHome()">رجوع</button>
    </div>
    <div class="card placeholder">جاهز للمرحلة التالية</div>
  </section>

  <section id="cleaning" class="page">
    <div class="page-head">
      <h2>النظافة</h2>
      <button class="btn secondary" onclick="goHome()">رجوع</button>
    </div>
    <div class="card placeholder">جاهز للمرحلة التالية</div>
  </section>

  <section id="chefs" class="page">
    <div class="page-head">
      <h2>الشيفات</h2>
      <button class="btn secondary" onclick="goHome()">رجوع</button>
    </div>
    <div class="card">
      <input placeholder="كود الشيف">
      <button class="btn">دخول</button>
    </div>
  </section>

  <section id="warehouse" class="page">
    <div class="page-head">
      <h2>المستودع</h2>
      <button class="btn secondary" onclick="goHome()">رجوع</button>
    </div>
    <div class="card">
      <input placeholder="رمز المستودع">
      <button class="btn">دخول</button>
    </div>
  </section>

  <section id="admin" class="page">
    <div class="page-head">
      <h2>الإدارة</h2>
      <button class="btn secondary" onclick="goHome()">رجوع</button>
    </div>
    <div class="card">
      <input placeholder="رمز الإدارة">
      <button class="btn">دخول</button>
    </div>
  </section>

  <section id="settings" class="page">
    <div class="page-head">
      <h2>الإعدادات</h2>
      <button class="btn secondary" onclick="goHome()">رجوع</button>
    </div>
    <div class="card placeholder">جاهز للمرحلة التالية</div>
  </section>

</div>

<script>
document.getElementById("dateNow").textContent =
  new Date().toLocaleDateString("ar-SA", {
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
  });

function openPage(id){
  document.getElementById("home").style.display = "none";
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goHome(){
  document.getElementById("home").style.display = "block";
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
}
</script>

</body>
</html>
